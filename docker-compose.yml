services:
  # 1. PostgreSQL 데이터베이스
  postgres:
    image: postgres:17.11
    container_name: snapshot-postgres
    env_file:
      - ./FastAPI-Backend/.postgres.env
    ports:
      - "5432:5432"
    volumes:
      - snapshot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. vLLM gRPC
  llm-service:
    build:
      context: ./vLLM-Model
      dockerfile: Dockerfile.grpc
    image: hotel-vllm-grpc:0.1.0
    container_name: vllm-grpc
    ports:
      - "127.0.0.1:15051:50051"
    gpus: all
    ipc: host
    environment:
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - hf-cache:/root/.cache/huggingface

  # 3. FastAPI 백엔드
  backend:
    build:
      context: ./FastAPI-Backend
      dockerfile: Dockerfile
    image: snapshot-backend:local
    container_name: snapshot-backend
    env_file:
      - ./FastAPI-Backend/.env
    environment:
      DB_HOST: postgres
      VLLM_GRPC_HOST: vllm-grpc:50051
    ports:
      - "127.0.0.1:9000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000

  # 4. React 개발 서버
  react-dev:
    build:
      context: ./React-Frontend
      dockerfile: Dockerfile
    container_name: react-frontend
    expose:
      - "5173"
    volumes:
      - ./React-Frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

  # 5. 메인 레포 전용 Nginx 프록시
  react-proxy:
    image: nginx:alpine
    container_name: react-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - react-dev

volumes:
  snapshot-postgres-data:
    name: snapshot-postgres-data
  hf-cache:
    name: hf-cache