services:
  # 1. PostgreSQL 데이터베이스
  postgres:
    image: postgres:17.11
    container_name: snapshot-postgres
    env_file:
      - ./FastAPI-Backend/.postgres.env
    ports:
      - "5432:5432"
    volumes:
      - snapshot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. vLLM REST API
  # vllm-rest:
  #   build:
  #     context: ./vLLM-Model
  #     dockerfile: Dockerfile
  #   image: hotel-vllm:test
  #   container_name: vllm-rest
  #   ports:
  #     - "18000:8000"
  #   ipc: host
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #   environment:
  #     - HF_TOKEN=${HF_TOKEN}
  #   volumes:
  #     - hf-cache:/root/.cache/huggingface

  # 3. vLLM gRPC
  vllm-grpc:
    build:
      context: ./vLLM-Model
      dockerfile: Dockerfile.grpc
    image: hotel-vllm-grpc:0.1.0
    container_name: vllm-grpc
    ports:
      - "15051:50051"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - hf-cache:/root/.cache/huggingface

  # 4. FastAPI 백엔드
  backend:
    build:
      context: ./FastAPI-Backend
      dockerfile: Dockerfile
    image: snapshot-backend:local
    container_name: snapshot-backend
    env_file:
      - ./FastAPI-Backend/.env
    environment:
      DB_HOST: postgres
      VLLM_REST_URL: http://vllm-rest:8000
      VLLM_GRPC_HOST: vllm-grpc:50051
    ports:
      - "9000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      vllm-rest:
        condition: service_started
    command:
      - sh
      - -c
      - |
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000

  # 5. React 프론트엔드
  react-dev:
    build:
      context: ./React-Frontend
      dockerfile: Dockerfile
    container_name: react-frontend
    ports:
      - "3000:5173"
    volumes:
      - ./React-Frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

volumes:
  snapshot-postgres-data:
    name: snapshot-postgres-data
  hf-cache:
    name: hf-cache